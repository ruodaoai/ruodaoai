<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="若道 AI — 把 AI 装进桌面，把数据留在本机">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101A2C"/>
      <stop offset="1" stop-color="#16203A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#E0603F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E0603F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#8FB0E0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect width="1280" height="340" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="26" fill="url(#glow)"/>
  <rect width="1280" height="340" rx="26" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="338.5" rx="25.25" fill="none" stroke="#26344E" stroke-width="1.5"/>

  <rect x="72" y="82" width="11" height="11" rx="3" fill="#E0603F"/>
  <text x="94" y="92.5" font-size="14" font-weight="700" letter-spacing="3.2" fill="#E8795A">RUODAO AI · 若道</text>

  <text x="72" y="158" font-size="46" font-weight="700" fill="#F7F2EC">把 AI 装进桌面</text>
  <text x="72" y="212" font-size="46" font-weight="700" fill="#F7F2EC">把数据留在本机</text>
  <text x="72" y="250" font-size="18" fill="#A8B4C6">本地优先的 AI 桌面产品与开源插件生态</text>

  <g font-size="13" font-weight="600">
    <rect x="72" y="272" width="112" height="34" rx="17" fill="#2A1A17" stroke="#4A2B22"/>
    <text x="128" y="293.5" text-anchor="middle" fill="#F0A08A">本地优先</text>
    <rect x="194" y="272" width="112" height="34" rx="17" fill="#2A1A17" stroke="#4A2B22"/>
    <text x="250" y="293.5" text-anchor="middle" fill="#F0A08A">模型自选</text>
    <rect x="316" y="272" width="104" height="34" rx="17" fill="#2A1A17" stroke="#4A2B22"/>
    <text x="368" y="293.5" text-anchor="middle" fill="#F0A08A">MIT 开源</text>
  </g>

  <circle cx="790" cy="266" r="5" fill="#E0603F" opacity="0.5"/>
  <circle cx="1254" cy="304" r="3.5" fill="#E0603F" opacity="0.35"/>

  <rect x="806" y="52" width="392" height="232" rx="18" fill="#16213A" opacity="0.55" stroke="#28364F"/>
  <rect x="838" y="76" width="392" height="232" rx="18" fill="#18233C" opacity="0.85" stroke="#2C3B57"/>
  <rect x="870" y="100" width="392" height="232" rx="18" fill="#16213A" stroke="#2E3D59" filter="url(#cardShadow)"/>

  <rect x="1120" y="60" width="146" height="34" rx="17" fill="#E0603F"/>
  <text x="1193" y="82" font-size="13" font-weight="600" fill="#1A0F0B" text-anchor="middle">数据不出本机</text>

  <rect x="898" y="130" width="48" height="48" rx="14" fill="#E0603F"/>
  <g transform="translate(898 130) scale(0.75)" fill="none" stroke="#1A0F0B" stroke-width="3.2" stroke-linejoin="round">
    <path d="M19 17.5h18.5L46 26v20.5H19z"/>
    <path d="M37 17.5V26h9"/>
    <path d="M26 33h13M26 39.5h9" stroke-linecap="round"/>
  </g>

  <text x="962" y="157" font-size="16" font-weight="600" fill="#F2EDE7">若道工作台</text>
  <text x="962" y="175" font-size="9.5" letter-spacing="1.8" fill="#8C99AE" class="mono">LOCAL-FIRST WORKSPACE</text>

  <line x1="898" y1="196" x2="1234" y2="196" stroke="#27344C" stroke-width="1.5"/>

  <rect x="898" y="212" width="252" height="9" rx="4.5" fill="#2B3953"/>
  <rect x="898" y="230" width="196" height="9" rx="4.5" fill="#2B3953"/>
  <rect x="898" y="248" width="128" height="9" rx="4.5" fill="#E0603F" opacity="0.8"/>

  <rect x="1160" y="256" width="16" height="44" rx="8" fill="#E0603F" opacity="0.25"/>
  <rect x="1188" y="236" width="16" height="64" rx="8" fill="#E0603F" opacity="0.45"/>
  <rect x="1216" y="216" width="16" height="84" rx="8" fill="#E0603F"/>
</svg>
