<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-label="若道 AI — 把 AI 装进桌面，把数据留在本机">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDFB"/>
      <stop offset="0.55" stop-color="#FBF2EA"/>
      <stop offset="1" stop-color="#F4E6DD"/>
    </linearGradient>
    <radialGradient id="mGlow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#C8442B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C8442B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C8442B" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="mCardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#8A3A24" flood-opacity="0.16"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect width="640" height="470" rx="22" fill="url(#mBg)"/>
  <rect width="640" height="470" rx="22" fill="url(#mGlow)"/>
  <rect width="640" height="470" rx="22" fill="url(#mGrid)"/>
  <rect x="0.75" y="0.75" width="638.5" height="468.5" rx="21.25" fill="none" stroke="#EAD8CC" stroke-width="1.5"/>

  <rect x="36" y="44" width="9" height="9" rx="2.5" fill="#C8442B"/>
  <text x="54" y="53" font-size="12" font-weight="700" letter-spacing="2.6" fill="#B0482F">RUODAO AI · 若道</text>

  <text x="36" y="128" font-size="52" font-weight="700" fill="#221A16">把 AI 装进桌面</text>
  <text x="36" y="186" font-size="52" font-weight="700" fill="#221A16">把数据留在本机</text>
  <text x="36" y="226" font-size="17" fill="#7B675E">本地优先的 AI 桌面产品与开源插件生态</text>

  <g font-size="12.5" font-weight="600">
    <rect x="36" y="248" width="104" height="32" rx="16" fill="#F8E3D9" stroke="#EFC9B9"/>
    <text x="88" y="269" text-anchor="middle" fill="#A8402A">本地优先</text>
    <rect x="150" y="248" width="104" height="32" rx="16" fill="#F8E3D9" stroke="#EFC9B9"/>
    <text x="202" y="269" text-anchor="middle" fill="#A8402A">模型自选</text>
    <rect x="264" y="248" width="96" height="32" rx="16" fill="#F8E3D9" stroke="#EFC9B9"/>
    <text x="312" y="269" text-anchor="middle" fill="#A8402A">MIT 开源</text>
  </g>

  <rect x="36" y="302" width="568" height="132" rx="18" fill="#FFFFFF" stroke="#E8D4C7" filter="url(#mCardShadow)"/>

  <rect x="56" y="330" width="44" height="44" rx="12" fill="#C8442B"/>
  <g transform="translate(56 330) scale(0.69)" fill="none" stroke="#FFF6F1" stroke-width="3.2" stroke-linejoin="round">
    <path d="M19 17.5h18.5L46 26v20.5H19z"/>
    <path d="M37 17.5V26h9"/>
    <path d="M26 33h13M26 39.5h9" stroke-linecap="round"/>
  </g>

  <text x="114" y="354" font-size="16" font-weight="600" fill="#241A15">若道工作台</text>
  <text x="114" y="372" font-size="8.5" letter-spacing="1.6" fill="#A08979" class="mono">LOCAL-FIRST WORKSPACE</text>

  <rect x="432" y="330" width="144" height="30" rx="15" fill="#C8442B"/>
  <text x="504" y="350" font-size="12.5" font-weight="600" fill="#FFF6F1" text-anchor="middle">数据不出本机</text>

  <rect x="56" y="394" width="210" height="7" rx="3.5" fill="#EFE5DC"/>
  <rect x="56" y="409" width="140" height="7" rx="3.5" fill="#C8442B" opacity="0.72"/>

  <rect x="548" y="400" width="12" height="20" rx="6" fill="#C8442B" opacity="0.22"/>
  <rect x="570" y="388" width="12" height="32" rx="6" fill="#C8442B" opacity="0.4"/>
  <rect x="592" y="376" width="12" height="44" rx="6" fill="#C8442B"/>

  <circle cx="612" cy="60" r="3" fill="#C8442B" opacity="0.3"/>
</svg>
